<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta
      name="description"
      content="StarIS BIN LOD — load a massive 62-byte point catalog in-browser. Far generalized, near accurate. $0 Spark demo."
    />
    <title>StarIS BIN LOD (Spark)</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>StarIS BIN LOD (multi-tile)</h1>
        <p>Far generalized · near accurate · stars appear as each tile arrives · 62-byte records</p>
      </div>
      <div class="controls">
        <div class="meta" id="lod-mode">LOD …</div>
        <div class="meta" id="draw-count">…</div>
      </div>
    </header>

    <main id="canvas-wrap" aria-label="BIN point catalog">
      <div class="hud" id="hud-status">Starting…</div>
    </main>

    <footer class="footer">
      $0 Spark demo — no Firebase Storage. Multi-tile Drive-derived GaiaSource LOD
      (RA/Dec → sky sphere; tiles.json + data/tiles/*.bin).
    </footer>

    <script>
      if (/[?&]lod=v2(?:&|$)/.test(location.search)) {
        window.__V2_PREFETCH__ = { order0: fetch("data/v2-pilot/o0_p0.pack") };
      }
    </script>
    <script type="module">
      if (/[?&]lod=v2(?:&|$)/.test(location.search)) {
        const mod = await import("./js/lod-v2.js");
        await mod.startV2();
      } else {
        await import("./js/lod-app.js");
      }
    </script>
  </body>
</html>
